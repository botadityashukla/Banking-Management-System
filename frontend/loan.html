<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loans Management - GlobalTrust Bank</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <div id="navbar-container"></div>

    <main class="container py-4">
        
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <div>
                <h3 class="fw-bold mb-1" style="color: var(--bank-navy-dark);">
                    <i class="bi bi-file-earmark-text-fill text-primary me-2"></i>Loan Products & Applications
                </h3>
                <p class="text-muted small mb-0">Apply for retail loans with transparent interest schedules and status tracking.</p>
            </div>
            <div>
                <span class="badge bg-light text-secondary border px-3 py-2">
                    <i class="bi bi-shield-lock me-1"></i>Secure Application Portal
                </span>
            </div>
        </div>

        <div class="row g-4">
            
            <!-- Loan Application Form -->
            <div class="col-lg-5">
                <div class="card bank-card p-4">
                    <h5 class="fw-bold mb-3">Apply for a New Loan</h5>

                    <div id="alertMsg" class="alert d-none small mb-3"></div>

                    <form id="loanForm" autocomplete="off">
                        
                        <div class="mb-3">
                            <label class="form-label">Servicing Branch</label>
                            <select class="form-select" id="branchId" required>
                                <option value="" disabled selected>Loading branches...</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Loan Product</label>
                            <select class="form-select" id="loanType" required>
                                <option value="Personal">Personal Loan (12.5% p.a.)</option>
                                <option value="Home">Home Loan (8.5% p.a.)</option>
                                <option value="Auto">Auto Loan (10.0% p.a.)</option>
                                <option value="Education">Education Loan (9.0% p.a.)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Loan Amount ($)</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" id="amount" min="1000" step="100" placeholder="Min $1,000" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Loan Term (Months)</label>
                            <input type="number" class="form-control" id="durationMonths" min="6" max="360" placeholder="e.g. 24" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-bank-primary py-2 fw-semibold" id="applyBtn">
                                Submit Application for Approval
                            </button>
                        </div>

                    </form>
                </div>
            </div>

            <!-- Existing Loans Table -->
            <div class="col-lg-7">
                <div class="card bank-card p-4 h-100">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0">Your Existing Loans</h5>
                        <button class="btn btn-sm btn-outline-primary" onclick="loadMyLoans()">
                            <i class="bi bi-arrow-clockwise me-1"></i>Refresh
                        </button>
                    </div>

                    <div class="bank-table-wrapper">
                        <div class="table-responsive">
                            <table class="table bank-table align-middle small">
                                <thead>
                                    <tr>
                                        <th>Loan ID</th>
                                        <th>Type</th>
                                        <th>Principal</th>
                                        <th>Rate</th>
                                        <th>Term</th>
                                        <th>Start Date</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="myLoansTableBody">
                                    <tr><td colspan="7" class="text-center py-4 text-muted">Loading loan records...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        requireAuth();
        const user = getCurrentUser();
        const customerId = user.customerId || 1;

        async function init() {
            try {
                // Populate branches
                const branchRes = await apiCall('/api/branches');
                const branchSelect = document.getElementById('branchId');
                branchSelect.innerHTML = '<option value="" disabled selected>Select branch</option>';
                (branchRes.branches || []).forEach(b => {
                    branchSelect.innerHTML += `<option value="${b.BranchID}">${b.BranchName} (${b.City})</option>`;
                });

                loadMyLoans();
            } catch (err) {
                console.error(err);
            }
        }

        async function loadMyLoans() {
            const tbody = document.getElementById('myLoansTableBody');
            try {
                const res = await apiCall(`/api/customers/${customerId}/loans`);
                if (!res.loans || res.loans.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No loan applications found.</td></tr>';
                    return;
                }

                tbody.innerHTML = res.loans.map(l => {
                    let statusBadge = 'bg-secondary';
                    if (l.Status === 'Approved' || l.Status === 'Active') statusBadge = 'bg-success';
                    if (l.Status === 'Pending') statusBadge = 'bg-warning text-dark';
                    if (l.Status === 'Rejected') statusBadge = 'bg-danger';

                    return `
                        <tr>
                            <td class="font-monospace fw-bold">#${l.LoanID}</td>
                            <td><span class="badge bg-light text-dark border">${l.LoanType}</span></td>
                            <td class="fw-bold">${formatCurrency(l.Amount)}</td>
                            <td>${l.InterestRate}%</td>
                            <td>${l.DurationMonths}m</td>
                            <td class="text-nowrap">${new Date(l.StartDate).toLocaleDateString()}</td>
                            <td><span class="badge ${statusBadge}">${l.Status}</span></td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger">${err.message}</td></tr>`;
            }
        }

        document.getElementById('loanForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('applyBtn');
            const alertBox = document.getElementById('alertMsg');
            btn.disabled = true;

            const payload = {
                customerId,
                branchId: document.getElementById('branchId').value,
                loanType: document.getElementById('loanType').value,
                amount: document.getElementById('amount').value,
                durationMonths: document.getElementById('durationMonths').value
            };

            try {
                const res = await apiCall('/api/loans/apply', 'POST', payload);
                alertBox.className = 'alert alert-success small mb-3';
                alertBox.textContent = res.message;
                alertBox.classList.remove('d-none');
                showToast('Loan application submitted!', 'success');
                document.getElementById('loanForm').reset();
                loadMyLoans();
            } catch (err) {
                alertBox.className = 'alert alert-danger small mb-3';
                alertBox.textContent = err.message;
                alertBox.classList.remove('d-none');
            } finally {
                btn.disabled = false;
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            init();
        });
    </script>
</body>
</html>
