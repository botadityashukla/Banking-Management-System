<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw Funds - GlobalTrust Bank</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <div id="navbar-container"></div>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="card bank-card p-4 p-md-5">
                    
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-3 p-3 mb-2">
                            <i class="bi bi-box-arrow-up fs-3"></i>
                        </div>
                        <h4 class="fw-bold mb-1" style="color: var(--bank-navy-dark);">Withdraw Funds</h4>
                        <p class="text-muted small mb-0">Balance validated by database triggers to prevent overdraft</p>
                    </div>

                    <div id="alertMsg" class="alert d-none small mb-4" role="alert"></div>

                    <form id="withdrawForm" autocomplete="off">
                        
                        <div class="mb-3">
                            <label class="form-label">Source Account</label>
                            <select class="form-select" id="accountNo" required>
                                <option value="" disabled selected>Loading accounts...</option>
                            </select>
                            <div class="form-text small" id="balanceHint">Available balance will appear here.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Amount to Withdraw</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" id="amount" min="1" step="0.01" placeholder="0.00" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Description / Remarks (Optional)</label>
                            <input type="text" class="form-control" id="description" placeholder="e.g. ATM cash withdrawal, teller payout">
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-bank-primary py-2 fw-semibold" id="withdrawBtn">
                                Confirm & Process Withdrawal
                            </button>
                        </div>

                    </form>

                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        requireAuth();
        const user = getCurrentUser();
        let loadedAccounts = [];

        async function populateAccounts() {
            try {
                const customerId = user.customerId || 1;
                const res = await apiCall(`/api/customers/${customerId}/accounts`);
                loadedAccounts = res.accounts || [];

                const select = document.getElementById('accountNo');
                select.innerHTML = '<option value="" disabled selected>Select account</option>';

                loadedAccounts.forEach(acc => {
                    if (acc.Status === 'Active') {
                        select.innerHTML += `
                            <option value="${acc.AccountNo}">
                                ${acc.AccountType} - ${maskAccount(acc.AccountNo)} (${formatCurrency(acc.Balance)})
                            </option>
                        `;
                    }
                });

                select.addEventListener('change', (e) => {
                    const acc = loadedAccounts.find(a => a.AccountNo === e.target.value);
                    if (acc) {
                        document.getElementById('balanceHint').textContent = `Available Balance: ${formatCurrency(acc.Balance)}`;
                    }
                });
            } catch (err) {
                showAlert('Error loading accounts: ' + err.message, 'danger');
            }
        }

        function showAlert(msg, type) {
            const alert = document.getElementById('alertMsg');
            alert.textContent = msg;
            alert.className = `alert alert-${type} small mb-4`;
            alert.classList.remove('d-none');
        }

        document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const accountNo = document.getElementById('accountNo').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const description = document.getElementById('description').value;

            const acc = loadedAccounts.find(a => a.AccountNo === accountNo);
            if (acc && Number(acc.Balance) < amount) {
                showAlert(`Insufficient funds. Your balance is ${formatCurrency(acc.Balance)}. Negative balances are prevented by database constraints.`, 'danger');
                return;
            }

            const btn = document.getElementById('withdrawBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Processing Withdrawal...';

            try {
                const res = await apiCall('/api/transactions/withdraw', 'POST', {
                    accountNo,
                    amount,
                    description
                });
                showAlert(res.message, 'success');
                showToast('Withdrawal completed successfully!', 'success');
                document.getElementById('withdrawForm').reset();
                populateAccounts();
            } catch (err) {
                showAlert(err.message, 'danger');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Confirm & Process Withdrawal';
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            populateAccounts();
        });
    </script>
</body>
</html>
